name: Offline release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install and test
        shell: pwsh
        run: |
          python -m pip install '.[dev,demo]'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --test tests/test_dsh_snapshot.mjs tests/test_dsh_sources.mjs tests/test_dsh_ui.mjs tests/test_dsh_launcher.mjs tests/test_dsh_lifecycle.mjs tests/test_discovery_example.mjs tests/test_skill_ui.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/build_plugin.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:TOOLLERY_TEST_PYTHON = (Get-Command python).Source
          node --test tests/test_plugin.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m twine check dist/*.whl dist/*.tar.gz
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Installed-wheel DSH smoke without provider credentials
        shell: pwsh
        run: |
          python -m venv wheel-env
          $wheel = (Get-ChildItem dist/*.whl).FullName
          & wheel-env/Scripts/python.exe -m pip install "${wheel}[demo]"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $launcher = (Resolve-Path wheel-env/Scripts/toollery-dsh.exe).Path
          Push-Location $env:RUNNER_TEMP
          try {
            & $launcher init 'toollery smoke workspace'
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            & $launcher chat --config 'toollery smoke workspace/toollery.json' --offline-smoke
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
      - uses: actions/upload-artifact@v4
        with:
          name: toollery-dsh
          path: dist/*
